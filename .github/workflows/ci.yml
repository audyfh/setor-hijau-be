name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  check:
    name: Lint, Test, and Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.3-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: setor_hijau_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.5

      - name: Run migrations
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/setor_hijau_test?sslmode=disable
        run: go run ./cmd/migrate up

      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/setor_hijau_test?sslmode=disable
        run: go test -v -race ./...

      - name: Verify sqlc generation is up to date
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.28.0 generate
          git diff --exit-code internal/platform/db/sqlc
